name: Extract IB-TECH website
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, '[skip extract]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract website package
        run: unzip -o 'ibtech-website-updated (3).zip' -d .
      - name: Commit extracted website
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Extract IB-TECH website [skip extract]'
          git push
