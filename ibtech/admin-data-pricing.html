<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mobile Data Pricing — IB-TECH ePINs</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="css/style.css"><style>body{background:#f7faf9}.pricing-wrap{max-width:1100px;margin:40px auto;padding:0 20px}.box{background:#fff;border:1px solid #dce8e2;border-radius:16px;padding:22px;box-shadow:0 12px 30px rgba(16,33,61,.06)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button{border:1px solid #dce8e2;background:#fff;padding:10px 15px;border-radius:9px}.tabs button.active{background:#0aa56c;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card{border:1px solid #e1e8e5;border-radius:12px;padding:15px}.card h3{margin:0 0 4px}.card small{color:#68748a}.row{display:flex;gap:10px;align-items:end;margin-top:12px}.field{flex:1}.field label{display:block;font-size:.75rem;margin-bottom:5px}.field input{width:100%;padding:10px;border:1px solid #ccd7d2;border-radius:8px;box-sizing:border-box}.save{margin-top:18px}.note{color:#68748a;font-size:.85rem}</style></head><body><div class="pricing-wrap"><div class="box"><h1>Mobile Data Pricing</h1><p class="note">Admin pricing controls for MTN, GLO, Airtel and 9mobile. Prices are stored in this browser until the server pricing API is enabled.</p><div class="tabs" id="tabs"></div><div class="grid" id="plans"></div><button class="btn btn-primary save" id="save">Save changes</button><p class="note" id="status"></p></div></div><script>const NET=['MTN','GLO','AIRTEL','9MOBILE'],LABEL={MTN:'MTN',GLO:'GLO',AIRTEL:'Airtel','9MOBILE':'9mobile'},BASE=[['100mb','100MB',100],['200mb','200MB',150],['500mb','500MB',300],['1gb','1GB',500],['2gb','2GB',900],['3gb','3GB',1200],['5gb','5GB',1800],['10gb','10GB',3000],['15gb','15GB',4500],['20gb','20GB',6000]];let selected='MTN';let rows=JSON.parse(localStorage.getItem('ibtech_data_prices')||'null')||NET.flatMap(n=>BASE.map(([id,label,price])=>({network:n,id,label,price,enabled:true})));function render(){tabs.innerHTML=NET.map(n=>`<button class="${n===selected?'active':''}" onclick="selected='${n}';render()">${LABEL[n]}</button>`).join('');plans.innerHTML=rows.filter(x=>x.network===selected).map(p=>`<div class="card"><h3>${p.label}</h3><small>${LABEL[selected]} mobile data</small><div class="row"><div class="field"><label>Price (₦)</label><input type="number" min="0" value="${p.price}" data-id="${p.id}"></div><label><input type="checkbox" data-on="${p.id}" ${p.enabled?'checked':''}> Active</label></div></div>`).join('')}save.onclick=()=>{rows.filter(x=>x.network===selected).forEach(p=>{p.price=Number(document.querySelector(`[data-id="${p.id}"]`).value)||0;p.enabled=document.querySelector(`[data-on="${p.id}"]`).checked});localStorage.setItem('ibtech_data_prices',JSON.stringify(rows));status.textContent=`${LABEL[selected]} pricing saved on this device.`};render();</script><script src="js/site.js" defer></script></body></html>
