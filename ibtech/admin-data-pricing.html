<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mobile Data Pricing — IB-TECH ePINs</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="css/style.css"><style>body{background:#f7faf9}.pricing-wrap{max-width:1100px;margin:40px auto;padding:0 20px}.box{background:#fff;border:1px solid #dce8e2;border-radius:16px;padding:22px;box-shadow:0 12px 30px rgba(16,33,61,.06)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button{border:1px solid #dce8e2;background:#fff;padding:10px 15px;border-radius:9px}.tabs button.active{background:#0aa56c;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card{border:1px solid #e1e8e5;border-radius:12px;padding:15px}.card h3{margin:0 0 4px}.card small{color:#68748a}.row{display:flex;gap:10px;align-items:end;margin-top:12px}.field{flex:1}.field label{display:block;font-size:.75rem;margin-bottom:5px}.field input{width:100%;padding:10px;border:1px solid #ccd7d2;border-radius:8px;box-sizing:border-box}.save{margin-top:18px}.note{color:#68748a;font-size:.85rem}</style></head><body><div class="pricing-wrap"><div class="box"><h1>Mobile Data Pricing</h1><p class="note">Admin pricing controls for MTN, GLO, Airtel and 9mobile. Changes are saved to the server database when the admin session is authorized.</p><div class="tabs" id="tabs"></div><div class="grid" id="plans"></div><button class="btn btn-primary save" id="save">Save changes</button><p class="note" id="status"></p></div></div><script>const API='/api',NET=['MTN','GLO','AIRTEL','9MOBILE'],LABEL={MTN:'MTN',GLO:'GLO',AIRTEL:'Airtel','9MOBILE':'9mobile'};let selected='MTN',rows=[];async function load(){status.textContent='Loading server pricing…';try{const r=await fetch(API+'/admin/data-plans',{credentials:'include'});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();rows=Array.isArray(data)?data:(data.plans||[]);if(!rows.length)throw new Error('No pricing data returned');render();status.textContent='Server pricing loaded.'}catch(e){status.textContent='Unable to load server pricing. Please log in as an authorized admin first.';render()}}function render(){tabs.innerHTML=NET.map(n=>`<button class="${n===selected?'active':''}" onclick="selected='${n}';render()">${LABEL[n]}</button>`).join('');const filtered=rows.filter(x=>x.network===selected);plans.innerHTML=filtered.length?filtered.map(p=>`<div class="card"><h3>${p.label||p.name||p.plan}</h3><small>${LABEL[selected]} mobile data</small><div class="row"><div class="field"><label>Price (₦)</label><input type="number" min="0" value="${Number(p.price)||0}" data-id="${p.id}"></div><label><input type="checkbox" data-on="${p.id}" ${p.enabled!==false?'checked':''}> Active</label></div></div>`).join(''):'<p class="note">No plans available for this network.</p>'}save.onclick=async()=>{try{const selectedRows=rows.filter(x=>x.network===selected);selectedRows.forEach(p=>{const input=document.querySelector(`[data-id="${p.id}"]`),on=document.querySelector(`[data-on="${p.id}"]`);if(input)p.price=Number(input.value)||0;if(on)p.enabled=on.checked});const r=await fetch(API+'/admin/data-plans',{method:'PUT',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({network:selected,plans:selectedRows})});if(!r.ok)throw new Error('HTTP '+r.status);status.textContent=`${LABEL[selected]} pricing saved to the server.`}catch(e){status.textContent='Save failed. Please confirm admin login/session and try again.'}};load();</script><script src="js/site.js" defer></script></body></html>
